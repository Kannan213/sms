<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a-red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5" fill="none" stroke="#b45309" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Paper background with subtle texture feel -->
  <rect width="1100" height="800" fill="#f5f2eb"/>
  <!-- Very subtle ruled-paper vibe at top -->
  <rect x="0" y="0" width="1100" height="4" fill="#1a1a1a"/>

  <!-- ── TITLE BLOCK ── -->
  <text x="48" y="44" font-family="'IBM Plex Mono',monospace" font-size="11" fill="#6b7280" letter-spacing="3">FX PLATFORM · SERVICE ARCHITECTURE</text>
  <text x="48" y="70" font-family="'IBM Plex Sans',sans-serif" font-size="26" font-weight="600" fill="#1a1a1a" letter-spacing="-1">trade-acceptor</text>
  <!-- thin underline -->
  <line x1="48" y1="78" x2="360" y2="78" stroke="#d1cfc8" stroke-width="1"/>

  <!-- ══════════════════════════════════════
       LEFT RAIL: UPSTREAM INPUT
  ══════════════════════════════════════ -->

  <!-- Section label -->
  <text x="48" y="110" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" letter-spacing="2">UPSTREAM</text>

  <!-- Upstream system box -->
  <rect x="48" y="120" width="148" height="52" rx="3" fill="#ffffff" stroke="#d1cfc8" stroke-width="1.5"/>
  <text x="122" y="141" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Upstream System</text>
  <text x="122" y="157" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">FX trade source</text>

  <!-- arrow + label -->
  <line x1="122" y1="172" x2="122" y2="196" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="128" y="188" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6b7280">XML</text>

  <!-- Solace IN queue — pill shape -->
  <rect x="48" y="198" width="148" height="48" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="122" y="217" font-family="'IBM Plex Sans',sans-serif" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">trade-inbound</text>
  <text x="122" y="232" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#b45309" text-anchor="middle">Solace queue</text>

  <!-- arrow into core -->
  <line x1="196" y1="222" x2="234" y2="222" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ══════════════════════════════════════
       CORE SERVICE BOX
  ══════════════════════════════════════ -->

  <!-- Core service outer boundary — hand-drawn feel with slightly uneven corners via rx -->
  <rect x="234" y="98" width="436" height="410" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Service name header bar -->
  <rect x="234" y="98" width="436" height="36" rx="4" fill="#1a1a1a"/>
  <text x="452" y="121" font-family="'IBM Plex Mono',monospace" font-size="11" font-weight="500" fill="#f5f2eb" text-anchor="middle" letter-spacing="1">trade-acceptor</text>

  <!-- Internal step connectors vertical spine -->
  <!-- Step labels as small mono badges -->

  <!-- ── STEP 1: Validate ── -->
  <rect x="258" y="154" width="130" height="56" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="323" y="175" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Validate</text>
  <text x="323" y="192" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">schema · business rules</text>

  <!-- ── STEP 2: Enrich ── -->
  <rect x="258" y="232" width="130" height="56" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="323" y="253" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Enrich</text>
  <text x="323" y="270" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">transform · augment</text>

  <!-- ── STEP 3: Persist ── -->
  <rect x="258" y="310" width="130" height="56" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="323" y="331" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Persist</text>
  <text x="323" y="348" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">stored procedure</text>

  <!-- step connector lines left side-->
  <line x1="323" y1="210" x2="323" y2="232" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="323" y1="288" x2="323" y2="310" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- DB to the right of persist -->
  <line x1="388" y1="338" x2="414" y2="338" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Trade DB box -->
  <rect x="414" y="310" width="118" height="56" rx="3" fill="#f9fafb" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- little DB cylinder hint via two ellipses -->
  <text x="473" y="333" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Trade DB</text>
  <text x="473" y="350" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">stored proc · SQL</text>

  <!-- bi-directional arrow hint: return from DB -->
  <line x1="473" y1="310" x2="473" y2="258" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#a-muted)"/>
  <text x="478" y="285" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af">resultset</text>

  <!-- ── STEP 4: Build Protobuf ── -->
  <rect x="414" y="154" width="118" height="56" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="473" y="175" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Build Proto</text>
  <text x="473" y="192" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">resultset → protobuf</text>

  <!-- step 4 arrow down to publish -->
  <line x1="473" y1="210" x2="473" y2="234" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ── STEP 5: Publish to trade-bus ── -->
  <rect x="414" y="234" width="118" height="56" rx="3" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="473" y="255" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Publish</text>
  <text x="473" y="272" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">→ trade-bus</text>

  <!-- Arrow from publish step to trade-bus (exit core service) -->
  <line x1="532" y1="262" x2="584" y2="262" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a-blue)"/>

  <!-- Arrow inbound (222) connecting into validate -->
  <!-- already drawn above as line x1=196 -->

  <!-- ── S3 ARCHIVE (branch off validate) ── -->
  <!-- Dashed branch down from validate -->
  <line x1="323" y1="210" x2="323" y2="388" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="323" y1="388" x2="258" y2="388" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#a-muted)"/>

  <!-- S3 box inside core boundary, bottom left -->
  <rect x="258" y="388" width="130" height="44" rx="3" fill="#fff7ed" stroke="#d97706" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="323" y="406" font-family="'IBM Plex Sans',sans-serif" font-size="11" font-weight="500" fill="#92400e" text-anchor="middle">S3 Bucket</text>
  <text x="323" y="421" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#b45309" text-anchor="middle">raw XML archive</text>

  <!-- archive label on branch -->
  <text x="327" y="348" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af">archive</text>

  <!-- ── FAILURE PATH ── -->
  <!-- Dashed red from enrich and persist bottom to resilience below -->
  <line x1="388" y1="366" x2="414" y2="448" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-red)"/>
  <line x1="323" y1="366" x2="323" y2="448" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-red)"/>
  <text x="328" y="414" font-family="'IBM Plex Mono',monospace" font-size="8" fill="#b45309">on failure</text>

  <!-- ══════════════════════════════════════
       TRADE-BUS — THE STAR
  ══════════════════════════════════════ -->

  <!-- trade-bus as a wide prominent pill -->
  <rect x="584" y="234" width="188" height="56" rx="28" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <!-- subtle inner glow ring -->
  <rect x="590" y="240" width="176" height="44" rx="22" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <text x="678" y="257" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="500" fill="#1d4ed8" text-anchor="middle">trade-bus</text>
  <text x="678" y="275" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#3b82f6" text-anchor="middle">Solace queue · Protobuf</text>

  <!-- "open for anyone" annotation -->
  <text x="678" y="308" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">↓ subscribe to receive trades</text>

  <!-- ══════════════════════════════════════
       ADAPTORS
  ══════════════════════════════════════ -->

  <!-- Section label -->
  <text x="800" y="110" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" letter-spacing="2">CONSUMERS</text>

  <!-- Adaptor A -->
  <line x1="772" y1="248" x2="820" y2="200" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="820" y="166" width="160" height="52" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="900" y="188" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">adaptor-a</text>
  <text x="900" y="204" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">→ Downstream A</text>

  <!-- Adaptor B -->
  <line x1="772" y1="262" x2="820" y2="262" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="820" y="236" width="160" height="52" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="900" y="258" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">adaptor-b</text>
  <text x="900" y="274" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">→ Downstream B</text>

  <!-- Adaptor C -->
  <line x1="772" y1="276" x2="820" y2="324" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="820" y="306" width="160" height="52" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="900" y="328" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">adaptor-c</text>
  <text x="900" y="344" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">→ Downstream C</text>

  <!-- "future consumers" suggestion -->
  <rect x="820" y="380" width="160" height="44" rx="3" fill="none" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="6,4"/>
  <text x="900" y="398" font-family="'IBM Plex Sans',sans-serif" font-size="11" font-weight="400" fill="#d1d5db" text-anchor="middle">future consumer</text>
  <text x="900" y="414" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#e5e7eb" text-anchor="middle">tap into trade-bus</text>

  <!-- dashed line to future consumer -->
  <line x1="772" y1="272" x2="806" y2="402" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#a-muted)"/>

  <!-- ══════════════════════════════════════
       MIDDLEWARE RESILIENCE
  ══════════════════════════════════════ -->

  <rect x="234" y="448" width="436" height="88" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="452" y="471" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="600" fill="#92400e" text-anchor="middle">middleware-resilience</text>
  <text x="452" y="490" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#b45309" text-anchor="middle">captures failed payloads · support can replay after debugging</text>

  <!-- three mini segments -->
  <rect x="252" y="502" width="118" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="311" y="519" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#92400e" text-anchor="middle">payload captured</text>

  <rect x="382" y="502" width="118" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="441" y="519" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#92400e" text-anchor="middle">root cause debug</text>

  <rect x="512" y="502" width="118" height="26" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="571" y="519" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#92400e" text-anchor="middle">support replay ↺</text>

  <!-- ══════════════════════════════════════
       OBSERVABILITY STRIP
  ══════════════════════════════════════ -->

  <text x="48" y="574" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" letter-spacing="2">OBSERVABILITY</text>

  <!-- thin separator line -->
  <line x1="48" y1="582" x2="1052" y2="582" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Splunk -->
  <rect x="48" y="594" width="164" height="54" rx="3" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="130" y="616" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Splunk</text>
  <text x="130" y="634" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">log aggregation · search</text>

  <!-- ELK -->
  <rect x="224" y="594" width="164" height="54" rx="3" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="306" y="616" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">ELK Stack</text>
  <text x="306" y="634" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Elasticsearch · Kibana</text>

  <!-- Grafana -->
  <rect x="400" y="594" width="164" height="54" rx="3" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="482" y="616" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Grafana</text>
  <text x="482" y="634" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">dashboards · alerts</text>

  <!-- Mimir -->
  <rect x="576" y="594" width="164" height="54" rx="3" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="658" y="616" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Mimir</text>
  <text x="658" y="634" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">metrics store</text>

  <!-- Tempo -->
  <rect x="752" y="594" width="164" height="54" rx="3" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="834" y="616" font-family="'IBM Plex Sans',sans-serif" font-size="12" font-weight="500" fill="#1a1a1a" text-anchor="middle">Tempo</text>
  <text x="834" y="634" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" text-anchor="middle">distributed traces</text>

  <!-- ══════════════════════════════════════
       LEGEND
  ══════════════════════════════════════ -->

  <text x="48" y="682" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#9ca3af" letter-spacing="2">LEGEND</text>

  <!-- sync -->
  <line x1="48" y1="700" x2="90" y2="700" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="98" y="704" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6b7280">synchronous</text>

  <!-- async dashed -->
  <line x1="200" y1="700" x2="242" y2="700" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#a-muted)"/>
  <text x="250" y="704" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6b7280">async / archive</text>

  <!-- failure -->
  <line x1="370" y1="700" x2="412" y2="700" stroke="#b45309" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-red)"/>
  <text x="420" y="704" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6b7280">failure path</text>

  <!-- trade-bus pill mini -->
  <rect x="534" y="690" width="70" height="20" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="569" y="704" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#1d4ed8" text-anchor="middle">trade-bus</text>
  <text x="612" y="704" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6b7280">pub/sub queue</text>

  <!-- dashed future -->
  <rect x="734" y="691" width="68" height="18" rx="3" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="768" y="703" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#d1d5db" text-anchor="middle">future</text>
  <text x="810" y="703" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#6b7280">not yet connected</text>

  <!-- ══════════════════════════════════════
       FLOW STEP NUMBERS — small, tasteful
  ══════════════════════════════════════ -->

  <circle cx="258" cy="154" r="9" fill="#1a1a1a"/>
  <text x="258" y="158" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f5f2eb" text-anchor="middle">1</text>

  <circle cx="258" cy="232" r="9" fill="#1a1a1a"/>
  <text x="258" y="236" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f5f2eb" text-anchor="middle">2</text>

  <circle cx="258" cy="310" r="9" fill="#1a1a1a"/>
  <text x="258" y="314" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f5f2eb" text-anchor="middle">3</text>

  <circle cx="414" cy="154" r="9" fill="#1a1a1a"/>
  <text x="414" y="158" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f5f2eb" text-anchor="middle">4</text>

  <circle cx="414" cy="234" r="9" fill="#1a1a1a"/>
  <text x="414" y="238" font-family="'IBM Plex Mono',monospace" font-size="9" fill="#f5f2eb" text-anchor="middle">5</text>

</svg>